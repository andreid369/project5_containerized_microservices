AWSTemplateFormatVersion: "2010-09-09"
# Needed for the hosted rotation Lambda (AWS::SecretsManager::RotationSchedule
# with HostedRotationLambda). Deploy with --capabilities CAPABILITY_IAM CAPABILITY_AUTO_EXPAND.
Transform: AWS::SecretsManager-2020-07-23
Description: "Product Service - Step 8: + template-owned Secrets Manager database secret with rotation"

# Generated from cloudformation/product-service.yaml by scripts/render-cfn-steps.py.
# Do not edit by hand.

Parameters:
  ImageTag:
    Type: String
    Default: "1.0.0"
    Description: Image tag pushed to ECR in step 2. Used for the CloudFormation-managed task definitions only; after step 6 the pipeline deploys commit-SHA tags.
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
    AllowedValues: [db.t4g.micro, db.t4g.small, db.t4g.medium]
  DbMasterUsername:
    Type: String
    Default: productadmin
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]{1,15}$"
    Description: RDS master username. The password is generated and kept in Secrets Manager, never in a parameter.
  AlbIngressCidr:
    Type: String
    Default: 0.0.0.0/0
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}$"
    Description: Who may reach the public load balancer on port 80. Use your own IP (x.x.x.x/32) to keep the demo private.
  MinTasks:
    Type: Number
    Default: 2
    MinValue: 1
    Description: Minimum (and initial) number of tasks. Two spreads them across both availability zones.
  MaxTasks:
    Type: Number
    Default: 4
    MinValue: 1
  GitHubRepository:
    Type: String
    AllowedPattern: "^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$"
    Description: GitHub repository holding this project, as owner/name (for example my-user/product-service).
  GitHubBranch:
    Type: String
    Default: main
  TestTrafficCidr:
    Type: String
    Default: 10.0.0.0/16
    AllowedPattern: "^(\\d{1,3}\\.){3}\\d{1,3}/\\d{1,2}$"
    Description: Who may reach the blue/green test listener (port 8080). The default keeps it inside the VPC; set your IP/32 to test a new version before traffic shifts.
  DeploymentConfigName:
    Type: String
    Default: CodeDeployDefault.ECSAllAtOnce
    AllowedValues:
      - CodeDeployDefault.ECSAllAtOnce
      - CodeDeployDefault.ECSCanary10Percent5Minutes
      - CodeDeployDefault.ECSLinear10PercentEvery1Minutes
    Description: How CodeDeploy shifts production traffic from blue to green.
  FargateBaseTasks:
    Type: Number
    Default: 1
    MinValue: 0
    Description: Tasks that always run on regular (on-demand) Fargate. They can't be interrupted, so they set the availability floor. Set it to MinTasks to keep the whole minimum on on-demand.
  FargateWeight:
    Type: Number
    Default: 1
    MinValue: 0
    Description: Relative share of tasks above the base that run on regular Fargate.
  FargateSpotWeight:
    Type: Number
    Default: 3
    MinValue: 0
    Description: Relative share of tasks above the base that run on Fargate Spot (up to about 70% cheaper, can be interrupted with a 2-minute warning).
  SecretRotationDays:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 365
    Description: Rotate the database password every N days.

Resources:
  # ==========================================================================
  # Step 2: ECR repository
  # ==========================================================================
  EcrRepository:
    Type: AWS::ECR::Repository
    # Images outlive the stack. Delete with: aws ecr delete-repository --repository-name product-service --force
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: product-service
      # Immutable tags: a tag always means the same image, so a deployment or a
      # rollback to a tag is exact. Push a new tag (version or git SHA) per build.
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration:
        ScanOnPush: true
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images after 7 days",
                "selection": { "tagStatus": "untagged", "countType": "sinceImagePushed", "countUnit": "days", "countNumber": 7 },
                "action": { "type": "expire" }
              },
              {
                "rulePriority": 2,
                "description": "Keep the 30 most recent images",
                "selection": { "tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 30 },
                "action": { "type": "expire" }
              }
            ]
          }
      Tags:
        - { Key: Project, Value: product-service }

  # ==========================================================================
  # Step 3: networking
  # Two availability zones. Public subnets hold the ALB and the NAT gateway;
  # private subnets hold the tasks (or container instances) and the database.
  # ==========================================================================
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: product-service-vpc }

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Name, Value: product-service-igw }

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - { Key: Name, Value: product-service-public-a }

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - { Key: Name, Value: product-service-public-b }

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.10.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - { Key: Name, Value: product-service-private-a }

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.0.11.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - { Key: Name, Value: product-service-private-b }

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: product-service-public }

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  # One NAT gateway to keep the cost down (about $0.045/hour). For production,
  # use one per availability zone so losing a zone doesn't cut off the other.
  NatEip:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags:
        - { Key: Name, Value: product-service-nat }

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: product-service-private }

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetARouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # Free gateway endpoint: ECR image layers are stored in S3, so layer
  # downloads skip the NAT gateway (and its per-GB charge).
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PrivateRouteTable]

  # --------------------------------------------------------------------------
  # Security groups. Each layer accepts traffic only from the layer in front:
  # internet -> ALB (80) -> app (3000) -> database (5432).
  # Cross-references are separate Ingress/Egress resources to avoid cycles.
  # --------------------------------------------------------------------------
  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Product Service database
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        # The database never initiates connections. A rule to localhost replaces
        # the default allow-all egress rule, which leaves no outbound access.
        - Description: No outbound traffic
          IpProtocol: "-1"
          CidrIp: 127.0.0.1/32
      Tags:
        - { Key: Name, Value: product-service-db }

  # Fargate (awsvpc): every task has its own network interface and this
  # security group, so rules apply per task, not per host.
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Product Service tasks
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - Description: HTTPS to AWS APIs (ECR, Secrets Manager, CloudWatch Logs) through the NAT gateway
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - { Key: Name, Value: product-service-app }

  AppEgressToDatabase:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AppSecurityGroup
      Description: PostgreSQL to the database only
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      DestinationSecurityGroupId: !Ref DbSecurityGroup

  DbIngressFromApp:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DbSecurityGroup
      Description: PostgreSQL from the Product Service tasks only
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref AppSecurityGroup

  # ==========================================================================
  # Step 3: database (Amazon RDS for PostgreSQL)
  # ==========================================================================
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for the Product Service database
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]

  Database:
    Type: AWS::RDS::DBInstance
    # A final snapshot is taken when the stack is deleted. Delete it by hand
    # when you no longer need it (it costs storage).
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: "18"
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: "20"
      MaxAllocatedStorage: 50
      StorageType: gp3
      StorageEncrypted: true
      DBName: products
      MasterUsername: !Ref DbMasterUsername
      # Step 8: the password comes from the template-owned secret (DbSecret).
      # The dynamic reference is resolved by CloudFormation at deploy time and is
      # never stored in the template, a parameter or the stack's outputs.
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DbSecret}:SecretString:password}}"
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!Ref DbSecurityGroup]
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 7
      CopyTagsToSnapshot: true
      AutoMinorVersionUpgrade: true
      DeletionProtection: false
      Tags:
        - { Key: Project, Value: product-service }

  # ==========================================================================
  # Step 3: ECS cluster, capacity providers, IAM roles, logs
  # ==========================================================================
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: product-service
      ClusterSettings:
        # Container Insights publishes task counts (DesiredTaskCount etc.) and
        # per-service CPU/memory, used by the dashboard in step 5.
        - Name: containerInsights
          Value: enabled
      Tags:
        - { Key: Project, Value: product-service }

  # ==========================================================================
  # Step 7: Fargate + Fargate Spot capacity provider strategy
  #   - FargateBaseTasks always run on regular Fargate: the availability floor
  #     that a Spot interruption can never take away.
  #   - Tasks above the base are split FargateWeight : FargateSpotWeight
  #     (default 1:3, so most scale-out capacity is Spot).
  # With the defaults and 2 tasks: 1 on Fargate + 1 on Fargate Spot.
  # The same strategy is passed to every CodeDeploy deployment through the
  # AppSpec (CodeBuild variable CAPACITY_PROVIDER_STRATEGY_JSON), because a
  # blue/green service gets its capacity settings from the deployment.
  # ==========================================================================
  ClusterCapacityProviders:
    Type: AWS::ECS::ClusterCapacityProviderAssociations
    Properties:
      Cluster: !Ref Cluster
      CapacityProviders: [FARGATE, FARGATE_SPOT]
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Base: !Ref FargateBaseTasks
          Weight: !Ref FargateWeight
        - CapacityProvider: FARGATE_SPOT
          Base: 0
          Weight: !Ref FargateSpotWeight

  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/product-service
      RetentionInDays: 14

  # Task role: used by the application itself, on EC2 and on Fargate. One
  # permission: read the one database secret.
  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Product Service application role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:*"
      Policies:
        - PolicyName: read-database-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref DbSecret

  # Execution role: used by ECS to pull the image and write logs. Fargate has
  # no container instance (and no instance role), so this role is required.
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: ECS agent role for the Product Service (image pull, logs)
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ecs-tasks.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy"

  # Fargate task definition. After step 6 the pipeline registers new revisions
  # of the same family from ecs/taskdef.json, which is then the source of
  # truth. Keep the two in sync if you change one.
  #
  # No credentials anywhere in it: DB_SECRET_ARN is only the secret's ARN, and
  # the application reads the username and password from Secrets Manager at
  # runtime with the task role.
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: product-service
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      # Fargate needs task-level CPU and memory from the supported combinations.
      Cpu: "256"
      Memory: "512"
      RuntimePlatform:
        OperatingSystemFamily: LINUX
        CpuArchitecture: X86_64
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: product-service
          Image: !Sub "${EcrRepository.RepositoryUri}:${ImageTag}"
          Essential: true
          ReadonlyRootFilesystem: true
          StopTimeout: 30
          PortMappings:
            - Name: http
              ContainerPort: 3000
              Protocol: tcp
          Environment:
            - { Name: PORT, Value: "3000" }
            - { Name: NODE_ENV, Value: production }
            - { Name: AWS_REGION, Value: !Ref AWS::Region }
            - { Name: DB_HOST, Value: !GetAtt Database.Endpoint.Address }
            - { Name: DB_PORT, Value: !GetAtt Database.Endpoint.Port }
            - { Name: DB_NAME, Value: products }
            - { Name: DB_SECRET_ARN, Value: !Ref DbSecret }
            - { Name: DB_SSL, Value: "true" }
            - { Name: RUN_MIGRATIONS, Value: "true" }
          HealthCheck:
            Command: ["CMD", "node", "src/healthcheck.js"]
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 30
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref AppLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app

  # ==========================================================================
  # Step 4: Application Load Balancer
  # ==========================================================================
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Product Service load balancer
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: HTTP from the allowed range
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: !Ref AlbIngressCidr
      SecurityGroupEgress:
        # Replaces the default allow-all rule; the real targets are added by
        # the AlbEgressTo* resources below.
        - Description: No outbound traffic except the rules below
          IpProtocol: "-1"
          CidrIp: 127.0.0.1/32
      Tags:
        - { Key: Name, Value: product-service-alb }

  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
        - Key: idle_timeout.timeout_seconds
          Value: "60"
      Tags:
        - { Key: Project, Value: product-service }

  # Fargate: IP targets (each task's own address) on the container port.
  AlbEgressToApp:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AlbSecurityGroup
      Description: To the Product Service tasks only
      IpProtocol: tcp
      FromPort: 3000
      ToPort: 3000
      DestinationSecurityGroupId: !Ref AppSecurityGroup

  AppIngressFromAlb:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AppSecurityGroup
      Description: Port 3000 from the load balancer only
      IpProtocol: tcp
      FromPort: 3000
      ToPort: 3000
      SourceSecurityGroupId: !Ref AlbSecurityGroup

  # "Blue" target group: production traffic starts here. CodeDeploy (step 6)
  # alternates production between this and the green target group.
  TargetGroupBlue:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      TargetType: ip
      Protocol: HTTP
      Port: 3000
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroupBlue

  # ==========================================================================
  # Step 4: ECS service on Fargate
  # ==========================================================================
  Service:
    Type: AWS::ECS::Service
    DependsOn: [HttpListener, ClusterCapacityProviders, TaskDefinition]
    Properties:
      ServiceName: product-service
      Cluster: !Ref Cluster
      # The task definition FAMILY, not !Ref TaskDefinition. ECS resolves it to
      # the latest revision when the service is created (hence the DependsOn).
      # After that the value never changes, so a new revision registered by
      # CloudFormation (step 8) or by the pipeline never makes CloudFormation
      # call UpdateService with a task definition, which ECS rejects for a
      # CODE_DEPLOY service. New revisions reach the service via CodeDeploy.
      TaskDefinition: product-service
      # No LaunchType and no CapacityProviderStrategy: the service is created
      # with the cluster's default strategy (FARGATE). With the CODE_DEPLOY
      # controller, later changes to where tasks run arrive with each CodeDeploy
      # deployment (AppSpec CapacityProviderStrategy, step 7), so this resource
      # never has to change, which CloudFormation couldn't do on this service.
      PlatformVersion: LATEST
      DesiredCount: !Ref MinTasks
      # The deployment controller is chosen when the service is created. It is
      # CODE_DEPLOY from the start so step 6 can add blue/green deployments
      # without replacing or migrating the service. Consequence: between steps
      # 4 and 6, new images are deployed by the pipeline only (see README).
      DeploymentController:
        Type: CODE_DEPLOY
      HealthCheckGracePeriodSeconds: 60
      EnableECSManagedTags: true
      PropagateTags: SERVICE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
          SecurityGroups: [!Ref AppSecurityGroup]
      LoadBalancers:
        - ContainerName: product-service
          ContainerPort: 3000
          TargetGroupArn: !Ref TargetGroupBlue

  # ==========================================================================
  # Step 4: Auto Scaling (target tracking)
  # Scaling is on CPU and memory, not on ALB requests per target: the request
  # metric is tied to one target group, and blue/green swaps the target group
  # on every deployment, which would leave that policy reading the idle one.
  # ==========================================================================
  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub "service/${Cluster}/${Service.Name}"
      MinCapacity: !Ref MinTasks
      MaxCapacity: !Ref MaxTasks
      # No RoleARN: Application Auto Scaling uses its service-linked role.

  CpuScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: product-service-cpu-60
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 60
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        ScaleOutCooldown: 60
        ScaleInCooldown: 300

  MemoryScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: product-service-memory-75
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 75
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageMemoryUtilization
        ScaleOutCooldown: 60
        ScaleInCooldown: 300

  # ==========================================================================
  # Step 5: CloudWatch dashboard
  #
  # Note on CPUReservation and MemoryReservation: these AWS/ECS cluster metrics
  # describe reserved capacity on EC2 container instances. AWS publishes them
  # only for clusters with EC2 capacity, not for Fargate, so on this cluster
  # that widget stays empty. The widget next to it shows the Fargate
  # equivalent from Container Insights (CpuReserved vs CpuUtilized, and the
  # same for memory). DesiredTaskCount also comes from Container Insights.
  # ==========================================================================
  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: product-service
      DashboardBody: !Sub |
        {
          "widgets": [
            {
              "type": "text", "x": 0, "y": 0, "width": 24, "height": 2,
              "properties": {
                "markdown": "## Product Service on ECS Fargate\nCluster **${Cluster}**, service **${Service.Name}**. CPUReservation and MemoryReservation are published for EC2 capacity only; the Fargate reservation is shown by Container Insights (CpuReserved, MemoryReserved)."
              }
            },
            {
              "type": "metric", "x": 0, "y": 2, "width": 12, "height": 6,
              "properties": {
                "title": "Cluster CPUReservation and MemoryReservation (%)",
                "region": "${AWS::Region}", "view": "timeSeries", "stat": "Average", "period": 60,
                "yAxis": { "left": { "min": 0, "max": 100 } },
                "metrics": [
                  [ "AWS/ECS", "CPUReservation", "ClusterName", "${Cluster}", { "label": "CPUReservation" } ],
                  [ "AWS/ECS", "MemoryReservation", "ClusterName", "${Cluster}", { "label": "MemoryReservation" } ]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 2, "width": 12, "height": 6,
              "properties": {
                "title": "Tasks: DesiredTaskCount, RunningTaskCount, PendingTaskCount",
                "region": "${AWS::Region}", "view": "timeSeries", "stat": "Average", "period": 60,
                "yAxis": { "left": { "min": 0 } },
                "metrics": [
                  [ "ECS/ContainerInsights", "DesiredTaskCount", "ClusterName", "${Cluster}", "ServiceName", "${Service.Name}", { "label": "Desired" } ],
                  [ "ECS/ContainerInsights", "RunningTaskCount", "ClusterName", "${Cluster}", "ServiceName", "${Service.Name}", { "label": "Running" } ],
                  [ "ECS/ContainerInsights", "PendingTaskCount", "ClusterName", "${Cluster}", "ServiceName", "${Service.Name}", { "label": "Pending" } ]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 8, "width": 12, "height": 6,
              "properties": {
                "title": "CPU reserved vs used (Fargate, CPU units)",
                "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 60,
                "yAxis": { "left": { "min": 0 } },
                "metrics": [
                  [ "ECS/ContainerInsights", "CpuReserved", "ClusterName", "${Cluster}", "ServiceName", "${Service.Name}", { "label": "CpuReserved" } ],
                  [ "ECS/ContainerInsights", "CpuUtilized", "ClusterName", "${Cluster}", "ServiceName", "${Service.Name}", { "label": "CpuUtilized" } ]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 8, "width": 12, "height": 6,
              "properties": {
                "title": "Memory reserved vs used (Fargate, MiB)",
                "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 60,
                "yAxis": { "left": { "min": 0 } },
                "metrics": [
                  [ "ECS/ContainerInsights", "MemoryReserved", "ClusterName", "${Cluster}", "ServiceName", "${Service.Name}", { "label": "MemoryReserved" } ],
                  [ "ECS/ContainerInsights", "MemoryUtilized", "ClusterName", "${Cluster}", "ServiceName", "${Service.Name}", { "label": "MemoryUtilized" } ]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 14, "width": 12, "height": 6,
              "properties": {
                "title": "Service CPU and memory utilization (%, drives Auto Scaling)",
                "region": "${AWS::Region}", "view": "timeSeries", "stat": "Average", "period": 60,
                "yAxis": { "left": { "min": 0, "max": 100 } },
                "annotations": { "horizontal": [ { "label": "CPU target", "value": 60 } ] },
                "metrics": [
                  [ "AWS/ECS", "CPUUtilization", "ClusterName", "${Cluster}", "ServiceName", "${Service.Name}", { "label": "CPUUtilization" } ],
                  [ "AWS/ECS", "MemoryUtilization", "ClusterName", "${Cluster}", "ServiceName", "${Service.Name}", { "label": "MemoryUtilization" } ]
                ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 14, "width": 12, "height": 6,
              "properties": {
                "title": "Load balancer: requests, 5XX and p95 response time",
                "region": "${AWS::Region}", "view": "timeSeries", "period": 60,
                "metrics": [
                  [ "AWS/ApplicationELB", "RequestCount", "LoadBalancer", "${LoadBalancer.LoadBalancerFullName}", { "stat": "Sum", "label": "Requests" } ],
                  [ "AWS/ApplicationELB", "HTTPCode_Target_5XX_Count", "LoadBalancer", "${LoadBalancer.LoadBalancerFullName}", { "stat": "Sum", "label": "Target 5XX" } ],
                  [ "AWS/ApplicationELB", "HTTPCode_ELB_5XX_Count", "LoadBalancer", "${LoadBalancer.LoadBalancerFullName}", { "stat": "Sum", "label": "ALB 5XX" } ],
                  [ "AWS/ApplicationELB", "TargetResponseTime", "LoadBalancer", "${LoadBalancer.LoadBalancerFullName}", { "stat": "p95", "label": "p95 response time (s)", "yAxis": "right" } ]
                ]
              }
            }
          ]
        }

  # ==========================================================================
  # Step 6: blue/green prerequisites on the load balancer
  # A second ("green") target group, and a test listener on 8080 where the
  # new version is reachable before production traffic shifts to it.
  # ==========================================================================
  TargetGroupGreen:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      TargetType: ip
      Protocol: HTTP
      Port: 3000
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: { HttpCode: "200" }
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"

  TestListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Port: 8080
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroupGreen

  AlbIngressTestListener:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref AlbSecurityGroup
      Description: Blue/green test listener
      IpProtocol: tcp
      FromPort: 8080
      ToPort: 8080
      CidrIp: !Ref TestTrafficCidr

  # Rollback trigger: if the new version produces 5XX errors during the
  # deployment, CodeDeploy stops it and shifts traffic back to blue.
  Target5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Product Service targets return 5XX errors
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - Name: LoadBalancer
          Value: !GetAtt LoadBalancer.LoadBalancerFullName
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # ==========================================================================
  # Step 6: pipeline artifact store and source connection
  # ==========================================================================
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-artifacts
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 7

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub "${ArtifactBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  # Created in PENDING state. Complete the GitHub handshake once in the console
  # (Developer Tools > Settings > Connections > Update pending connection).
  GitHubConnection:
    Type: AWS::CodeConnections::Connection
    Properties:
      ConnectionName: product-service-github
      ProviderType: GitHub

  # ==========================================================================
  # Step 6: CodeBuild (build, test, push to ECR, render the task definition
  # and the AppSpec)
  # ==========================================================================
  BuildLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /codebuild/product-service
      RetentionInDays: 30

  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      Description: CodeBuild role for the Product Service image build
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: codebuild-product-service
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${BuildLogGroup.Arn}:*"
              - Sid: Artifacts
                Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject]
                Resource: !Sub "${ArtifactBucket.Arn}/*"
              - Sid: ArtifactBucket
                Effect: Allow
                Action: [s3:GetBucketAcl, s3:GetBucketLocation]
                Resource: !GetAtt ArtifactBucket.Arn
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: EcrPush
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:DescribeImages
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt EcrRepository.Arn

  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: product-service
      Description: Builds and tests the Product Service image, pushes it to ECR, renders taskdef.json and appspec.yaml
      ServiceRole: !GetAtt CodeBuildRole.Arn
      TimeoutInMinutes: 20
      Source:
        Type: CODEPIPELINE
        BuildSpec: buildspec.yml
      Artifacts:
        Type: CODEPIPELINE
      Cache:
        Type: LOCAL
        Modes: [LOCAL_DOCKER_LAYER_CACHE]
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Ref BuildLogGroup
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux-x86_64-standard:5.0
        PrivilegedMode: true # required to run docker build
        EnvironmentVariables:
          # Values that ecs/taskdef.json and ecs/appspec.yaml need;
          # scripts/render-template.py fills them in. None of them is a credential.
          - { Name: REPOSITORY_URI, Value: !GetAtt EcrRepository.RepositoryUri }
          - { Name: REPOSITORY_NAME, Value: !Ref EcrRepository }
          - { Name: EXECUTION_ROLE_ARN, Value: !GetAtt TaskExecutionRole.Arn }
          - { Name: TASK_ROLE_ARN, Value: !GetAtt TaskRole.Arn }
          - { Name: LOG_GROUP, Value: !Ref AppLogGroup }
          - { Name: DB_HOST, Value: !GetAtt Database.Endpoint.Address }
          - { Name: DB_PORT, Value: !GetAtt Database.Endpoint.Port }
          - { Name: DB_SECRET_ARN, Value: !Ref DbSecret }
          - Name: CAPACITY_PROVIDER_STRATEGY_JSON
            Value: !Sub '[{"CapacityProvider": "FARGATE", "Base": ${FargateBaseTasks}, "Weight": ${FargateWeight}}, {"CapacityProvider": "FARGATE_SPOT", "Base": 0, "Weight": ${FargateSpotWeight}}]'

  # ==========================================================================
  # Step 6: CodeDeploy (ECS blue/green)
  # ==========================================================================
  CodeDeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: CodeDeploy role for Product Service blue/green deployments
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: codedeploy.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AWSCodeDeployRoleForECS"

  CodeDeployApplication:
    Type: AWS::CodeDeploy::Application
    Properties:
      ApplicationName: product-service
      ComputePlatform: ECS

  DeploymentGroup:
    Type: AWS::CodeDeploy::DeploymentGroup
    Properties:
      ApplicationName: !Ref CodeDeployApplication
      DeploymentGroupName: product-service-dg
      ServiceRoleArn: !GetAtt CodeDeployRole.Arn
      DeploymentConfigName: !Ref DeploymentConfigName
      DeploymentStyle:
        DeploymentType: BLUE_GREEN
        DeploymentOption: WITH_TRAFFIC_CONTROL
      BlueGreenDeploymentConfiguration:
        DeploymentReadyOption:
          # Shift traffic as soon as green is healthy. Set STOP_DEPLOYMENT and
          # a wait time to approve the switch by hand after testing on :8080.
          ActionOnTimeout: CONTINUE_DEPLOYMENT
          WaitTimeInMinutes: 0
        TerminateBlueInstancesOnDeploymentSuccess:
          # Blue tasks stay up for 5 minutes after the switch, so a rollback
          # during that window is instant.
          Action: TERMINATE
          TerminationWaitTimeInMinutes: 5
      AutoRollbackConfiguration:
        Enabled: true
        Events: [DEPLOYMENT_FAILURE, DEPLOYMENT_STOP_ON_ALARM]
      AlarmConfiguration:
        Enabled: true
        Alarms:
          - Name: !Ref Target5xxAlarm
      ECSServices:
        - ClusterName: !Ref Cluster
          ServiceName: !GetAtt Service.Name
      LoadBalancerInfo:
        TargetGroupPairInfoList:
          - ProdTrafficRoute:
              ListenerArns: [!Ref HttpListener]
            TestTrafficRoute:
              ListenerArns: [!Ref TestListener]
            TargetGroups:
              - Name: !GetAtt TargetGroupBlue.TargetGroupName
              - Name: !GetAtt TargetGroupGreen.TargetGroupName

  # ==========================================================================
  # Step 6: CodePipeline (Source -> Build -> Deploy)
  # ==========================================================================
  PipelineRole:
    Type: AWS::IAM::Role
    Properties:
      Description: CodePipeline role for the Product Service pipeline
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: codepipeline.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: codepipeline-product-service
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Artifacts
                Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion, s3:PutObject, s3:GetBucketVersioning]
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub "${ArtifactBucket.Arn}/*"
              - Sid: Source
                Effect: Allow
                Action: [codeconnections:UseConnection, codestar-connections:UseConnection]
                Resource: !GetAtt GitHubConnection.ConnectionArn
              - Sid: Build
                Effect: Allow
                Action: [codebuild:StartBuild, codebuild:BatchGetBuilds]
                Resource: !GetAtt CodeBuildProject.Arn
              - Sid: Deploy
                Effect: Allow
                Action:
                  - codedeploy:CreateDeployment
                  - codedeploy:GetApplication
                  - codedeploy:GetApplicationRevision
                  - codedeploy:GetDeployment
                  - codedeploy:GetDeploymentConfig
                  - codedeploy:RegisterApplicationRevision
                Resource:
                  - !Sub "arn:${AWS::Partition}:codedeploy:${AWS::Region}:${AWS::AccountId}:application:${CodeDeployApplication}"
                  - !Sub "arn:${AWS::Partition}:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentgroup:${CodeDeployApplication}/${DeploymentGroup}"
                  - !Sub "arn:${AWS::Partition}:codedeploy:${AWS::Region}:${AWS::AccountId}:deploymentconfig:*"
              - Sid: RegisterTaskDefinition
                Effect: Allow
                Action: ecs:RegisterTaskDefinition
                Resource: "*" # this action doesn't support resource-level permissions
              - Sid: PassTaskRoles
                Effect: Allow
                Action: iam:PassRole
                Resource:
                  - !GetAtt TaskExecutionRole.Arn
                  - !GetAtt TaskRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com

  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: product-service
      PipelineType: V2
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: GitHub
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: "1"
              Configuration:
                ConnectionArn: !GetAtt GitHubConnection.ConnectionArn
                FullRepositoryId: !Ref GitHubRepository
                BranchName: !Ref GitHubBranch
                OutputArtifactFormat: CODE_ZIP
                DetectChanges: true
              OutputArtifacts:
                - Name: SourceOutput
        - Name: Build
          Actions:
            - Name: BuildTestPush
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: "1"
              Configuration:
                ProjectName: !Ref CodeBuildProject
              InputArtifacts:
                - Name: SourceOutput
              OutputArtifacts:
                - Name: BuildOutput
        - Name: Deploy
          Actions:
            - Name: BlueGreen
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CodeDeployToECS
                Version: "1"
              Configuration:
                ApplicationName: !Ref CodeDeployApplication
                DeploymentGroupName: !Ref DeploymentGroup
                TaskDefinitionTemplateArtifact: BuildOutput
                TaskDefinitionTemplatePath: taskdef.json
                AppSpecTemplateArtifact: BuildOutput
                AppSpecTemplatePath: appspec.yaml
                # imageDetail.json in BuildOutput holds the new image URI; the
                # action writes it where taskdef.json says <IMAGE1_NAME>.
                Image1ArtifactName: BuildOutput
                Image1ContainerName: IMAGE1_NAME
              InputArtifacts:
                - Name: BuildOutput

  # ==========================================================================
  # Step 8: database credentials in a template-owned Secrets Manager secret
  #
  # CloudFormation generates the password inside Secrets Manager; it never
  # appears in the template, a parameter, an output or the task definition.
  # The attachment adds the endpoint (host, port, engine) to the secret, so
  # the secret alone is enough to connect. The application reads it at
  # runtime with its task role and refreshes it after a rotation.
  # ==========================================================================
  DbSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: product-service/database
      Description: Product Service database credentials (username, password, host, port, dbname)
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"username": "${DbMasterUsername}", "dbname": "products"}'
        GenerateStringKey: password
        PasswordLength: 32
        # Alphanumeric only: avoids characters PostgreSQL or connection strings
        # treat specially, and is still about 190 bits of entropy.
        ExcludePunctuation: true
      Tags:
        - { Key: Project, Value: product-service }

  DbSecretAttachment:
    Type: AWS::SecretsManager::SecretTargetAttachment
    Properties:
      SecretId: !Ref DbSecret
      TargetId: !Ref Database
      TargetType: AWS::RDS::DBInstance

  # Rotation Lambda (created by the SecretsManager transform, from the AWS
  # single-user PostgreSQL template). It runs in the private subnets, reaches
  # the database on 5432 and Secrets Manager through the NAT gateway.
  RotationSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Product Service secret rotation Lambda
      VpcId: !Ref Vpc
      SecurityGroupEgress:
        - Description: HTTPS to the Secrets Manager API through the NAT gateway
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - { Key: Name, Value: product-service-rotation }

  RotationEgressToDatabase:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref RotationSecurityGroup
      Description: PostgreSQL to the database only
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      DestinationSecurityGroupId: !Ref DbSecurityGroup

  DbIngressFromRotation:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DbSecurityGroup
      Description: PostgreSQL from the secret rotation Lambda
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref RotationSecurityGroup

  DbSecretRotation:
    Type: AWS::SecretsManager::RotationSchedule
    DependsOn: [DbSecretAttachment, DbIngressFromRotation, RotationEgressToDatabase]
    Properties:
      SecretId: !Ref DbSecret
      HostedRotationLambda:
        RotationType: PostgreSQLSingleUser
        RotationLambdaName: product-service-db-rotation
        ExcludeCharacters: "\"@/\\'` "
        VpcSubnetIds: !Sub "${PrivateSubnetA},${PrivateSubnetB}"
        VpcSecurityGroupIds: !Ref RotationSecurityGroup
      RotationRules:
        AutomaticallyAfterDays: !Ref SecretRotationDays

Outputs:
  RepositoryUri:
    Description: ECR repository URI (docker tag/push target)
    Value: !GetAtt EcrRepository.RepositoryUri
  RepositoryArn:
    Value: !GetAtt EcrRepository.Arn
  ClusterName:
    Value: !Ref Cluster
  PrivateSubnetIds:
    Value: !Sub "${PrivateSubnetA},${PrivateSubnetB}"
  LogGroupName:
    Value: !Ref AppLogGroup
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint.Address
  DatabaseSecretArn:
    Description: Template-owned secret with the database credentials and endpoint
    Value: !Ref DbSecret
  TaskDefinitionArn:
    Description: Fargate task definition (for aws ecs run-task in step 3)
    Value: !Ref TaskDefinition
  AppSecurityGroupId:
    Value: !Ref AppSecurityGroup
  LoadBalancerDnsName:
    Value: !GetAtt LoadBalancer.DNSName
  ProductsUrl:
    Description: The public endpoint
    Value: !Sub "http://${LoadBalancer.DNSName}/products"
  ServiceName:
    Value: !GetAtt Service.Name
  DashboardUrl:
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/product-service"
  PipelineUrl:
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/codesuite/codepipeline/pipelines/${Pipeline}/view?region=${AWS::Region}"
  GitHubConnectionArn:
    Description: Complete the GitHub handshake for this connection in the console before the first pipeline run
    Value: !GetAtt GitHubConnection.ConnectionArn
  TestListenerUrl:
    Description: Green (new) version during a deployment, reachable from TestTrafficCidr
    Value: !Sub "http://${LoadBalancer.DNSName}:8080/products"
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
  CapacityProviderStrategy:
    Description: Cluster default and per-deployment strategy
    Value: !Sub "FARGATE base ${FargateBaseTasks} weight ${FargateWeight}, FARGATE_SPOT weight ${FargateSpotWeight}"
